<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зургийн цомог портал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" role="status" aria-label="Ачаалж байна"><span class="spinner"></span></div>

  <header class="top">
    <a class="logo" href="#" aria-label="Зургийн цомог">
      <svg width="44" height="44" viewBox="0 0 44 44" role="img" aria-hidden="true">
        <rect x="3" y="8" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="22" cy="22" r="7" fill="var(--accent)"/>
        <circle cx="33" cy="14" r="2" fill="currentColor"/>
      </svg>
      <span>Зургийн цомог</span>
    </a>
    <button id="themeBtn" type="button" aria-pressed="false">Харанхуй горим</button>
  </header>

  <main>
    <h1>Монголын үзэсгэлэнт газарууд</h1>
    <p class="lead">Карт дээр хулганаа аваачих эсвэл дарж зургийн мэдээллийг хар.</p>

    <section class="gallery" aria-label="Зургийн цомог">
      <article class="card" style="--i:0">
        <button class="flip" type="button" aria-label="Зураг 1-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo1.jpg" alt="Говийн нар жаргах" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 1</b>Газар: Хоргын тогоо</span>
        </button>
      </article>
      <article class="card" style="--i:1">
        <button class="flip" type="button" aria-label="Зураг 2-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo2.jpg" alt="Алтан намар" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 2</b>Газар: Сайхны хөтөл</span>
        </button>
      </article>
      <article class="card" style="--i:2">
        <button class="flip" type="button" aria-label="Зураг 3-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo3.jpg" alt="Зун хээр" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 3</b>Газар: Их газрын чулуу</span>
        </button>
      </article>
      <article class="card" style="--i:3">
        <button class="flip" type="button" aria-label="Зураг 4-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo4.jpg" alt="Хаврын уул" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 4</b>Газар: Цагаан суварга</span>
        </button>
      </article>
      <article class="card" style="--i:4">
        <button class="flip" type="button" aria-label="Зураг 5-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo5.jpg" alt="Өвлийн нуур" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 5</b>Газар: Цонжин болдог</span>
        </button>
      </article>
      <article class="card" style="--i:5">
        <button class="flip" type="button" aria-label="Зураг 6-ийн мэдээллийг эргүүлэх">
          <span class="face front"><img src="img/photo6.jpg" alt="Шөнийн од" loading="lazy"></span>
          <span class="face back"><b>Газрын нэр 6</b>Газар: Хөвсгөл нуур</span>
        </button>
      </article>
    </section>

    <section class="media">
      <figure>
        <video controls preload="metadata" poster="img/photo1.jpg" width="640">
          <source src="video/clip.webm" type="video/webm">
          <source src="video/clip.mp4" type="video/mp4">
          <track kind="captions" src="video/clip.mn.vtt" srclang="mn" label="Монгол" default>
          Таны хөтөч видеог дэмжихгүй байна.
        </video>
        <figcaption>Богино танилцуулга видео (хадмалтай)</figcaption>
      </figure>
      <figure>
        <iframe title="Улаанбаатарын газрын зураг" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=106.8%2C47.85%2C107.05%2C47.97&amp;layer=mapnik"></iframe>
        <figcaption>Зургууд авсан газрын зураг</figcaption>
      </figure>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
